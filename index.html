<style>
/* Layout: one phone column, always dark. Glass header with day chips, Next up hero, then one connected timeline per day. Rows show only the title and open on tap. Floating glass Add button opens a half sheet. */
:root{
  --bg:#0b0e15; --surface:#151923; --surface2:#1d2230; --line:rgba(255,255,255,.12);
  --fg:#f1f4f9; --muted:#8f98aa; --accent:#6aa9ff; --on-accent:#08111f;
  --a-flight:#6aa9ff; --a-food:#ffb454; --a-wedding:#f27aa8; --a-family:#5fd3a2; --a-logistics:#a99bff; --a-other:#8f98aa;
  --good:#5fd3a2; --warn:#ffb454; --danger:#ff7a7a;
  --bar:rgba(11,14,21,.62); --glass:rgba(255,255,255,.09); --glass-strong:rgba(30,35,46,.58); --glass-line:rgba(255,255,255,.12); --glass-hi:rgba(255,255,255,.26); --shadow:rgba(0,0,0,.45);
  --p1:#4f7cff; --p2:#e0719a; --p3:#e5a13d; --p4:#3fb58c; --p5:#9b7be8; --p6:#d9694a; --p7:#3aa6c9;

  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-block:calc(68px + env(safe-area-inset-top,0px)) calc(60px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;position:relative;z-index:1}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(90% 45% at 85% -5%,rgba(120,90,220,.28),transparent 70%),radial-gradient(80% 40% at 0% 8%,rgba(60,110,230,.22),transparent 70%)}
.num{font-variant-numeric:tabular-nums}

/* floating nav */
.bar{position:fixed;left:0;right:0;top:0;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.ntitle,.fab,.note-ro{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;min-height:44px;border-radius:999px;color:var(--fg);font-size:1.0625rem;font-weight:600;letter-spacing:-.01em;padding:0 18px;white-space:nowrap}
.fab{padding:0 18px 0 14px}
.fab svg{width:18px;height:18px}
.note-ro{font-size:.82rem}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;color:#fff;border:2px solid var(--bg);margin-left:-8px;flex:none}

/* addresses */
.places{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pc .pill{margin-top:auto;text-align:center;padding:7px 8px;font-size:.8rem}

.pc .addr b{display:block;color:var(--fg);font-size:.92rem;font-weight:600;line-height:1.25;margin-bottom:2px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--glass-line);background:var(--glass);box-shadow:inset 0 1px 0 var(--glass-hi);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600;text-decoration:none;color:var(--fg);display:inline-block}

/* day */
.day{padding-top:30px;scroll-margin-top:calc(70px + env(safe-area-inset-top,0px))}
.dayhead{font-size:2rem;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:0 0 6px}
.tnow{display:inline-block;vertical-align:middle;margin-left:10px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:999px;padding:4px 10px;position:relative;top:-2px}

.dayhead + .tl,.dayhead + .empty{margin-top:14px}
.tr.past .tm,.tr.past .ic{opacity:.5}
.stack{display:grid;gap:10px}
.empty{color:var(--muted);border:1px dashed var(--line);border-radius:16px;padding:16px;font-size:.92rem}

/* timeline */
.tl{display:block}
.tr{--c:var(--a-other);display:grid;grid-template-columns:4.2rem 28px minmax(0,1fr);column-gap:8px;position:relative;padding-bottom:10px}
.tr::before{content:"";position:absolute;left:calc(4.2rem + 8px + 13px);top:0;bottom:0;width:2px;background:rgba(255,255,255,.14)}

.chev{flex:none;width:18px;height:18px;margin-top:15px;color:var(--muted);transform:rotate(-90deg);transition:transform .2s}
.item[data-open="1"] .chev{transform:rotate(0)}

.det{display:grid;gap:10px;padding:12px 14px 14px;border-top:1px solid var(--line)}
.det .row{align-items:center}
.when{font-weight:600;font-size:.92rem}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);border-radius:999px;padding:3px 9px}
.tag i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.place{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.notes{font-size:.92rem;white-space:pre-line;overflow-wrap:anywhere}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{font-size:.82rem;font-weight:600;color:var(--c);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.names{display:flex;flex-wrap:wrap;gap:6px}
.nm{color:#fff;font-size:.8rem;font-weight:600;border-radius:999px;padding:4px 11px}
.who{display:flex;flex:none;padding-left:8px;margin-top:8px}
.who .av{width:24px;height:24px;font-size:.66rem;border-color:var(--surface)}
.fline{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.ap b{display:block;font-family:var(--display);font-size:1.5rem;line-height:1}
.ap span{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ap.r{text-align:right}
.track{height:2px;background:rgba(255,255,255,.18);border-radius:2px;min-width:30px}
.tznote{margin:34px 0 0;text-align:center;color:var(--muted);font-size:.8rem}
.syncbtn{margin-top:6px!important;display:block;margin:30px auto 0;background:none;border:0;color:var(--muted);font-size:.82rem;padding:8px 12px}

/* glass controls */
.glass{background:var(--glass);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 rgba(255,255,255,.04),0 10px 30px var(--shadow);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass,.top,.sheet{background:var(--surface2)}}
.btn{border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;padding:0 18px;min-height:44px}
.btn.ghost{background:var(--glass);color:var(--fg);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.5}

/* sheets */
html.locked .wrap,html.locked .bar,html.locked .tact{margin-left:12px;border:0;background:none;color:var(--accent-dark,#2f6bd6);font-weight:700;font-size:.9rem;padding:0}
.toast{display:none}
html.locked,html.locked body{overflow:hidden;overscroll-behavior:none;height:100%}
.scrim{position:fixed;left:0;right:0;top:0;bottom:0;z-index:20;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
.full{width:100%;max-width:640px;height:calc(100% - max(10px,env(safe-area-inset-top,0px)));display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--glass-line);border-bottom:0;border-radius:32px 32px 0 0;box-shadow:inset 0 1px 0 var(--glass-hi),0 -10px 40px var(--shadow);overflow:hidden}
@media (prefers-reduced-motion:no-preference){.full{animation:rise .26s cubic-bezier(.2,.8,.2,1)}@keyframes rise{from{transform:translateY(100%)}to{transform:none}}.item{transition:transform .12s}.item:active{transform:scale(.99)}}
.nav{flex:none;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:14px 16px 8px}
.nav b{text-align:center;font-family:var(--display);font-size:1.15rem}
.nbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg);background:var(--glass);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8)}
.nbtn svg{width:22px;height:22px}
.nbtn.done{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.nbtn.done:disabled{opacity:.35}
.fbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.grp{background:var(--surface);border-radius:20px;margin-bottom:16px;overflow:hidden}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 16px}
.frow + .frow{border-top:1px solid var(--line)}
.frow span{font-size:1rem}
.frow input,.frow textarea{font-size:1rem;background:transparent;border:0;outline:0;color:var(--fg);min-width:0}
.frow input[type=text]{width:100%;padding:14px 0;font-weight:600}
.frow input#f-loc{font-weight:400}
.frow input[type=text]::placeholder,.frow textarea::placeholder{color:var(--muted);font-weight:400}
.frow input[type=date],.frow input[type=time]{font-family:inherit;color:var(--fg);background:var(--glass);border-radius:10px;padding:6px 10px;min-height:36px}
.frow textarea{width:100%;padding:14px 0;resize:none;min-height:110px;font-family:inherit}
.whog{padding:14px 16px}
.wl{font-size:1rem;margin-bottom:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--glass-line);background:var(--glass);border-radius:999px;padding:4px 12px 4px 4px;font-size:.92rem;font-weight:600}
.opt .av{width:24px;height:24px;margin:0;border:0;font-size:.66rem}
.opt[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.drow{width:100%;min-height:52px;background:none;border:0;color:var(--danger);font-weight:600;font-size:1rem}
.scrim2{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;padding:0 8px calc(8px + env(safe-area-inset-bottom,0px))}
.sheet2{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--glass-strong);border:1px solid var(--glass-line);border-radius:32px;box-shadow:inset 0 1px 0 var(--glass-hi),0 18px 50px var(--shadow);-webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);padding:10px 20px 22px;animation:rise .24s cubic-bezier(.2,.8,.2,1)}

.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sfl{font-size:1.7rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.sttl{color:var(--muted);margin-top:2px}
.srow{display:flex;align-items:center;gap:10px;margin:14px 0 18px}
.chip2{background:#2f7d46;color:#fff;font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;border-radius:8px;padding:5px 10px}
.upd{color:var(--muted);font-size:.85rem}
.route{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-bottom:18px}

    var isNew=!item,layer=document.getElementById('layer');
    function close(){layer.replaceChildren();lockPage(false)}
    var title=h('input',{id:'f-title',type:'text',placeholder:'Event title',autocomplete:'off',autocapitalize:'sentences',enterkeyhint:'next','aria-label':'Event title',value:item?(item.title||''):''});
    var date=h('input',{id:'f-date',type:'date',min:DAYS[0].id,max:DAYS[DAYS.length-1].id,'aria-label':'Date',value:item&&item.day||activeDay});
    var tm=h('input',{id:'f-time',type:'time','aria-label':'Time',value:item&&item.time||''});
    var loc=h('input',{id:'f-loc',type:'text',placeholder:'Location (optional)',autocomplete:'off','aria-label':'Location',value:item?(item.place||item.address||''):''});
    var loc0=loc.value;
    var notes=h('textarea',{id:'f-notes',rows:'4',placeholder:'Description (optional)','aria-label':'Description'});notes.value=item&&item.notes||'';
    var save=h('button',{type:'submit',class:'nbtn done','aria-label':isNew?'Add':'Save'},svg('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'));
    function sync(){save.disabled=!title.value.trim()}
    title.addEventListener('input',sync);sync();
    var who=(item&&item.who||[]).slice(),whoBox=h('div',{class:'opts'});
    function drawWho(){whoBox.replaceChildren();PEOPLE.forEach(function(n,i){
      whoBox.append(h('button',{type:'button',class:'opt','aria-pressed':String(who.indexOf(n)>=0),onclick:function(){var x=who.indexOf(n);if(x>=0)who.splice(x,1);else who.push(n);drawWho()}},avatar(n,i),n))})}
    drawWho();
    var delArmed=false;
    var delBtn=isNew?null:h('button',{type:'button',class:'drow',onclick:function(){
      if(!delArmed){delArmed=true;delBtn.textContent='Tap again to delete';return}
      var snap=clean([item])[0];
      close();deleteItem(item.id).then(function(ok){if(ok)toast('Deleted','Undo',function(){restoreItem(snap)})})}},'Delete');
    function submit(e){
      e.preventDefault();
      var tt=title.value.trim();if(!tt){title.focus();return}
      var d=date.value;if(!DAYS.some(function(x){return x.id===d}))d=activeDay;
      var data={title:tt,day:d,time:tm.value,notes:notes.value.trim(),who:who.slice()};
      var lv=loc.value.trim();if(isNew||lv!==loc0){data.place=lv;data.address=''}
      activeDay=d;close();
      if(isNew){addItem(data).then(function(ok){if(ok)toast('Added')})}else updateItem(item.id,data);
    }
    var closeBtn=h('button',{type:'button',class:'nbtn','aria-label':'Close',onclick:close},svg('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'));
    var form=h('form',{class:'full',role:'dialog','aria-modal':'true','aria-label':isNew?'Add':'Edit',onsubmit:submit},
      h('div',{class:'nav'},closeBtn,h('b',null,isNew?'Add':'Edit'),save),
      h('div',{class:'fbody'},
        h('div',{class:'grp'},h('div',{class:'frow'},title)),
        h('div',{class:'grp'},
          h('label',{class:'frow',for:'f-date'},h('span',null,'Date'),date),
          h('label',{class:'frow',for:'f-time'},h('span',null,'Time'),tm)),
        h('div',{class:'grp'},h('div',{class:'frow'},loc)),
        h('div',{class:'grp'},h('div',{class:'frow'},notes)),
        h('div',{class:'grp whog'},h('div',{class:'wl'},'Who (Optional)'),whoBox),
        delBtn?h('div',{class:'grp'},delBtn):null));
    var scrim=h('div',{class:'scrim',onkeydown:function(e){if(e.key==='Escape')close()}},form);
    layer.replaceChildren(scrim);
    lockPage(true);
    fitScrim();
    if(isNew)title.focus();
  }

  /* start */
  try{var c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(Array.isArray(c)&&c.length){items=c;loaded=true}}catch(e){}
  function boot(){
    buildBar();render();loadWeather();
    if(LIVE()){
      refresh();
      setInterval(function(){if(!document.hidden)refresh()},20000);
      document.addEventListener('visibilitychange',function(){if(!document.hidden)refresh()});
    }
  }
  if(CL){CL.use('db').then(function(d){dbh=d||null;boot()},function(){boot()})}else{boot()}
  if(!CL&&'serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
</body>
</html>
