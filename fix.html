<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apply sheet updates</title><meta name="color-scheme" content="dark">
<style>
body{margin:0;background:#0b0e15;color:#f1f4f9;font:16px/1.45 -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;padding:max(24px,env(safe-area-inset-top)) 20px 40px}
h1{font-size:1.6rem;margin:0 0 8px} p{color:#8f98aa;margin:0 0 18px}
button{font:inherit;font-weight:700;border:0;border-radius:999px;background:#f1f4f9;color:#0b0e15;min-height:52px;padding:0 28px;width:100%}
button:disabled{opacity:.4}
pre{background:#151923;border-radius:16px;padding:14px;white-space:pre-wrap;font-size:.85rem;margin-top:18px;min-height:3em}
</style></head><body>
<h1>Apply sheet updates</h1>
<p>One tap makes this change in the Itinerary tab: Emma joins Maya on AA 2553 (8:30 AM to 4:54 PM) and her separate copy of that flight is removed.</p>
<button id="go">Apply updates</button>
<pre id="log">Ready.</pre>
<script src="config.js"></script>
<script>
var API=window.TRIP_CONFIG.apiUrl,log=document.getElementById('log'),btn=document.getElementById('go');
function say(t){log.textContent+='\n'+t}
var UPDATES=[
  {id:'f-aa2553',patch:{who:['Maya','Emma']}}
];
var ADDS=[];
var DELETES=['f-aa2553-emma'];
function list(){return fetch(API+'?action=list&t='+Date.now()).then(function(r){return r.json()})}
function post(b){return fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)})}
btn.onclick=async function(){
  btn.disabled=true;log.textContent='Working...';
  try{
    var before=await list();if(!before.ok)throw new Error('could not read the sheet');
    var have={};before.items.forEach(function(i){have[i.id]=i});
    for(var u of UPDATES){
      if(have[u.id]){await post({action:'update',id:u.id,patch:u.patch});say('Updated '+u.id)}else say('Skipped '+u.id+' (not found)');
    }
    for(var a of ADDS){
      if(have[a.id])say('Already there: '+a.id);else{await post({action:'add',item:a});say('Added '+a.id)}
    }
    for(var x of DELETES){
      if(have[x]){await post({action:'delete',id:x});say('Removed '+x)}else say('Already gone: '+x);
    }
    await new Promise(function(r){setTimeout(r,2500)});
    var after=await list(),bad=0;
    UPDATES.forEach(function(u){var i=after.items.find(function(x){return x.id===u.id});if(i&&i.who.join()!==u.patch.who.join()){bad++;say('Check '+u.id+': who is '+i.who.join()+' ')}});
    ADDS.forEach(function(a){if(!after.items.some(function(x){return x.id===a.id})){bad++;say('Missing '+a.id)}});
    DELETES.forEach(function(id){if(after.items.some(function(x){return x.id===id})){bad++;say('Still there: '+id)}});
    say(bad?'Some changes are not showing yet. Wait a few seconds and tap again.':'Done. Everything checks out.');
  }catch(e){say('Problem: '+e.message)}
  btn.disabled=false;
};
</script></body></html>
